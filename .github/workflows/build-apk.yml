name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Variable GOOGLE_SERVICES_JSON is not set. Paste the contents of app/google-services.json as a repo variable."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | jq . > app/google-services.json

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ vars.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Variable DEBUG_KEYSTORE_B64 is not set."
            exit 1
          fi
          mkdir -p keystore
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > keystore/debug.keystore

      - name: Build debug APK
        env:
          AIMAP_API_BASE_URL: ${{ vars.AIMAP_API_BASE_URL }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
